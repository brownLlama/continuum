# Builds the app on every push to main and every pull request, so a broken build shows up early.
# The debug APK is kept as a downloadable artifact for 14 days.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: continuum-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
