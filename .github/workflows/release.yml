# Publishes a signed APK as a GitHub release whenever a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore, base64-encoded
#   SIGNING_STORE_PASSWORD   its password
#   SIGNING_KEY_ALIAS        the key's alias
#   SIGNING_KEY_PASSWORD     the key's password
# Every release must be signed with the same key, or phones refuse the update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set; see the comment at the top of this file."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Continuum-$VERSION.apk"
          # A fixed name too, so releases/latest/download/Continuum.apk always gets the newest.
          cp app/build/outputs/apk/release/app-release.apk dist/Continuum.apk
          cd dist && sha256sum Continuum*.apk > SHA256SUMS.txt

      - name: Check the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do "$APKSIGNER" verify --print-certs "$apk"; done

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Re-running a tag replaces its APKs instead of failing on the existing files.
          overwrite_files: true
