# Publishes a signed APK as a GitHub release whenever a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# or from the Actions tab (Run workflow, version "1.0.0"): that releases the branch it runs on and
# creates the tag itself.
#
# Needs four repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64  the release keystore, base64-encoded
#   SIGNING_STORE_PASSWORD   its password
#   SIGNING_KEY_ALIAS        the key's alias
#   SIGNING_KEY_PASSWORD     the key's password
# Every release must be signed with the same key, or phones refuse the update.
#
# Actions are pinned to a commit (the version it belongs to is in the comment), so a tag that is
# moved later can't change what runs here with the signing key and write access.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The tag being released: the pushed tag, or v + the version typed in when run by hand.
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set; see the comment at the top of this file."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          mkdir -p dist
          # One fixed name in every release, so releases/latest/download/Continuum.apk always gets
          # the newest; the release itself says which version it is.
          cp app/build/outputs/apk/release/app-release.apk dist/Continuum.apk
          cd dist && sha256sum Continuum.apk > SHA256SUMS.txt

      # The key is only needed for the build: gone before any later step (or action) runs.
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do "$APKSIGNER" verify --print-certs "$apk"; done

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          # Re-running a tag replaces its APKs instead of failing on the existing files.
          overwrite_files: true
